<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Engineering Calculator Hub</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center;}
  .box{max-width:440px;}
  h1{color:#e8a33d;font-size:1.4rem;margin-bottom:8px;}
  p{color:#8b949e;line-height:1.6;}
  a{display:inline-block;margin-top:16px;background:#e8a33d;color:#0d1117;
    padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;}
</style>
<script>
  // Utility screens that are deliberately not pre-rendered (admin, history, reviews) are
  // client-side routes: send /history/ etc. to the app, which handles them.
  (function () {
    var seg = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^(admin|history|reviews)$/.test(seg)) location.replace('/?page=' + seg);
  })();
</script>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>That page doesn't exist, or the link is out of date. All calculators are on the home page.</p>
    <a href="/">Go to Engineering Calculator Hub</a>
  </div>
</body>
</html>
